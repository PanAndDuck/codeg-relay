name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: ${{ matrix.crate }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        crate: [codeg-relay-agent, codeg-relay, codeg-tunnel]
        exclude:
          - os: windows-latest
            crate: codeg-relay
          - os: windows-latest
            crate: codeg-tunnel
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/crates/${{ matrix.crate }}/target
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.crate }} -> target
      - name: Create isolated codeg directories
        env:
          ISOLATION_ROOT: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          import tempfile
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for name in ("CODEG_DATA_DIR", "CODEG_HOME"):
                  directory = tempfile.mkdtemp(prefix=f"{name.lower()}-", dir=os.environ["ISOLATION_ROOT"])
                  print(f"{name}={directory}", file=environment)
          PY
      - name: Check formatting
        run: cargo fmt --manifest-path crates/${{ matrix.crate }}/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path crates/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --manifest-path crates/${{ matrix.crate }}/Cargo.toml
      - name: Test release packaging
        if: matrix.crate == 'codeg-relay-agent'
        run: python scripts/ci/test_release.py -v
