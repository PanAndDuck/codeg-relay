[package]
name = "codeg-relay-agent"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "codeg-relay-agent"

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
codeg-tunnel = { path = "../codeg-tunnel" }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
png = "0.17"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
url = "2"
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
# Already in Cargo.lock transitively. Typed Win32 bindings are needed for a
# hidden session-notification window: GUI-subsystem tasks have no console.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
codeg-relay = { path = "../codeg-relay" }
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
