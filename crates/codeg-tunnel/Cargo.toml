[package]
name = "codeg-tunnel"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1.49", features = ["sync", "io-util", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", features = ["sink"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.49", features = ["test-util", "rt-multi-thread"] }
